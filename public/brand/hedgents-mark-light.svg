<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Hedgents Hg mark on light</title>
  <desc id="desc">Mercury element symbol Hg, atomic number 80, framed as a routed metal node.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.68" stop-color="#F4F0E8"/>
      <stop offset="1" stop-color="#E8E2D8"/>
    </radialGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1013"/>
      <stop offset="0.48" stop-color="#343B3D"/>
      <stop offset="0.72" stop-color="#0D1316"/>
      <stop offset="1" stop-color="#4A5152"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDBB59"/>
      <stop offset="0.55" stop-color="#A97922"/>
      <stop offset="1" stop-color="#C59631"/>
