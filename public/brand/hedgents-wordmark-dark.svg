<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 900" role="img" aria-labelledby="title desc">
  <title id="title">Hedgents Metal Execution Network logo for dark surfaces</title>
  <desc id="desc">Hedgents wordmark paired with the mercury element Hg and routed metal node.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF6"/>
      <stop offset="0.45" stop-color="#BEC3C5"/>
      <stop offset="0.72" stop-color="#F3F3EF"/>
      <stop offset="1" stop-color="#ADB3B5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CE6B"/>
      <stop offset="0.55" stop-color="#C99B37"/>
      <stop offset="1" stop-color="#E1B94E"/>
    </linearGradient>
  </defs>
  <g transform="translate(54 22) scale(.84)">
