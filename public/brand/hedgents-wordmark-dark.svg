    <path d="M656 560A100 105 0 1 1 456 560A100 105 0 1 1 656 560V686C656 744 621 778 568 791C539 798 521 814 514 833" fill="none" stroke="url(#steel)" stroke-width="47" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="514" cy="856" r="43" fill="none" stroke="url(#gold)" stroke-width="27"/>
  </g>
  <text x="1000" y="470" fill="url(#steel)" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="300" font-weight="500" letter-spacing="42" textLength="2040" lengthAdjust="spacingAndGlyphs">HEDGENTS</text>
  <text x="1018" y="642" fill="url(#steel)" opacity=".92" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="600" letter-spacing="28" textLength="2000" lengthAdjust="spacingAndGlyphs">METAL EXECUTION NETWORK</text>
